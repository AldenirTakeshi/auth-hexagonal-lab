spring:
  application:
    name: auth-hexagonal-lab
  datasource:
    url: jdbc:postgresql://localhost:5432/authlab
    username: authlab
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  config:
    import: optional:file:.env[.properties]

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000